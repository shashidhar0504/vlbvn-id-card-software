services:
  - type: web
    name: vlbvn-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://vlbvn-id-card-software.vercel.app
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: shashidharbiradar6@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: VLBVN Community <membership@vlbvn.org>
